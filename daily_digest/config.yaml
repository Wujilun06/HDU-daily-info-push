# ============================================================
# 每日信息整合推送 —— 配置文件
# 修改此文件即可增删监控源、调整分类、接入大模型。
# ============================================================

settings:
  timezone: "Asia/Shanghai"
  site_title: "每日信息整合"
  lookback_days: 120          # 首次回填窗口(天)；仅展示近 120 天内发布的文章
  output_dir: "output"        # 生成网页的目录（相对本文件）
  run_times: ["08:00", "20:00"]   # scheduler.py 进程内定时运行的时刻（HH:MM）

# ---------- 分类规则（按顺序匹配，命中第一个即归类）----------
# keywords 为空表示“兜底类”，所有未命中其它类的文章归入此类。
categories:
  # 分类直接对应官网板块（各 website_html 源已声明 category，按板块定类）
  - name: "通知公告"
    keywords: []
  - name: "学院新闻"
    keywords: []
  - name: "本科教学"
    keywords: []
  - name: "研究生教育"
    keywords: []
  - name: "招生就业"
    keywords: []
  - name: "党建思政"
    keywords: []
  - name: "科研信息"
    keywords: []
  - name: "学生工作"
    keywords: []
  - name: "公众号推文"
    keywords: []
  - name: "其他"
    keywords: []

# ---------- 大模型摘要（可选）----------
# enabled=false 或 private_config.json 中 llm_api_key 为空时，自动使用
# “抽取式摘要”兜底（免费离线）。api_key 不再写在这里，而是放在项目根目录的
# private_config.json（该文件已 gitignore，不入库）。详见 README「隐私与配置」。
# provider 支持任意 OpenAI 兼容接口（含各大模型厂商的兼容端点）。
llm:
  enabled: false
  base_url: "https://api.openai.com/v1"
  # api_key 已移至 private_config.json（本地隐私文件），此处不再保存密钥
  model: "gpt-4o-mini"
  timeout: 30

# ---------- 信息源 ----------
# 每个源可单独 enabled: true/false 开关。
# site 字段用于网页“来源”展示（站点/公众号级），区别于板块分类(category)。
sources:
  # ===== 杭电计算机学院官网（各板块列表页，自动按板块定类）=====
